<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чудо Обувь</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <img class="logo" src="logo.png" alt="Чудо Обувь">
    <h1>Чудо Обувь</h1>
    <div id="userbar"></div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>Обувь для всей семьи</h2>
      <p>Удобные модели для детей, женщин и мужчин на каждый день.</p>
    </div>
    <div class="hero-photos">
      <img src="uploads/IMG_WS_174110.png" alt="">
      <img src="uploads/IMG_MS_185531.png" alt="">
      <img src="uploads/IMG_KS_195217.png" alt="">
    </div>
  </section>

  <main>
    <section id="welcome" class="card">
      <h2>Добро пожаловать</h2>
      <p id="welcome-text"></p>
    </section>

    <section id="orders-box" class="card hidden">
      <h2>Заказы</h2>
      <p>Здесь будет список заказов (следующая работа, ПР 3.1).</p>
    </section>
    <section id="catalog" class="card">
      <h2>Каталог</h2>
      <div class="filters">
        <select id="category-select"></select>
        <input id="search-input" type="text" placeholder="Поиск по названию, производителю, описанию">
        <select id="sort-select">
          <option value="">Без сортировки</option>
          <option value="price_asc">Цена по возрастанию</option>
          <option value="price_desc">Цена по убыванию</option>
        </select>
      </div>
      <p id="catalog-empty" class="hidden">Ничего не найдено</p>
      <div id="catalog-list" class="products"></div>
    </section>
  </main>

  <footer class="status">
    <span id="server-status"></span>
    <button id="check-btn" class="secondary">Проверить связь</button>
  </footer>

  <div id="login-modal" class="modal hidden">
    <form id="login-form" class="modal-body small">
      <h2>Вход</h2>
      <label for="login-input">Логин</label>
      <input id="login-input" type="text" placeholder="например, isivanov" autocomplete="off">
      <div class="buttons">
        <button type="submit">Войти</button>
        <button type="button" id="login-cancel" class="secondary">Отмена</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
